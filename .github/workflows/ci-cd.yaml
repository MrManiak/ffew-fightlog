name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pylint-django loads the Auth settings, and Alliance Auth connects to Redis at startup.
      - name: Install redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: latest

      - name: Run Pylint
        run: |
          pip install tox
          tox -e pylint

  test:
    runs-on: ubuntu-latest
    needs: [pre-commit, pylint]
    strategy:
      matrix:
        django-version: ["52"]
        python-version: ["10", "11", "12", "13", "14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.${{ matrix.python-version }}"

      - name: Install redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: latest

      - name: Run Tests
        run: |
          pip install tox
          tox -e py3${{ matrix.python-version }}-django${{ matrix.django-version }}

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install flit
          flit build

      - name: Check the type catalog loads from the wheel
        run: |
          pip install dist/*.whl
          python -c "import fightlog.catalog as c; assert c.load_catalog().type_count > 1000"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-pypi:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing, no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
